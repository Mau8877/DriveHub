name: app

services:
  # ---------------------------------------
  # REVERSE PROXY (El punto de entrada)
  # ---------------------------------------
  proxy:
    image: nginx:alpine
    container_name: app-proxy
    # Defensa extra además de la resolución dinámica de nginx.conf: si de
    # todos modos llegara a morir (ej. el propio Docker Desktop matándolo a
    # mitad de un restart), que reintente solo en vez de quedar caído hasta
    # que alguien lo note a mano.
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # ---------------------------------------
  # FRONTEND (React + Vite) - MODO DESARROLLO
  # ---------------------------------------
  frontend:
    image: node:22-alpine
    container_name: app-frontend
    working_dir: /app/projects/frontend
    volumes:
      - .:/app
      # Ambos node_modules (raíz del workspace pnpm y el del paquete
      # frontend) tienen que estar aislados del bind mount de arriba -- si
      # no, pnpm dentro del contenedor escribe symlinks de Linux
      # directamente en tu filesystem de Windows apuntando a rutas que solo
      # existen DENTRO del contenedor (ej. /app/node_modules/.pnpm/...).
      # Esos symlinks quedan rotos para cualquier pnpm/tsc/ESLint que corras
      # en el host, y un pnpm install en el host los vuelve a pisar en
      # sentido contrario -- rompiendo lo del contenedor. Con volúmenes
      # nombrados, cada lado tiene su propio node_modules real y no chocan.
      - frontend_node_modules_root:/app/node_modules
      - frontend_node_modules_pkg:/app/projects/frontend/node_modules
    command: sh -c "corepack enable pnpm && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  # ---------------------------------------
  # BACKEND (Spring Boot 4.1 / Java 21) - MODO DESARROLLO
  # ---------------------------------------
  backend:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: app-backend
    working_dir: /app/projects/backend
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Necesario para que Testcontainers (tests de integración, ver
      # TESTING_BACKEND.md) pueda levantar contenedores (ej. Postgres real)
      # desde DENTRO de este contenedor -- sin esto, `mvn test` falla con
      # "Could not find a valid Docker environment" en cualquier test que
      # use Testcontainers.
      - /var/run/docker.sock:/var/run/docker.sock
    command: mvn spring-boot:run -Dspring-boot.run.profiles=dev
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Testcontainers necesita esto para hablar con el Docker Desktop de
      # Windows de forma confiable a través del socket montado -- sin esto,
      # su detección automática de estrategia de conexión falla en Windows
      # (ver TESTING_BACKEND.md).
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=app-redis
      - MINIO_URL=http://app-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------
  # DATABASE (PostgreSQL 18)
  # ---------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      # * Puerto del HOST configurable (POSTGRES_HOST_PORT en .env): si la máquina ya tiene
      # * un Postgres propio en 5432, el contenedor no puede publicar el mismo puerto.
      # * Dentro de la red de Docker el backend siempre usa 5432.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # CACHE (Redis 8)
  # ---------------------------------------
  redis:
    image: redis:8-alpine
    container_name: app-redis
    volumes:
      - redis_data:/data
      # Mapeamos tu archivo de configuración personalizado
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '6379:6379'
    networks:
      - app-network
    # Le decimos a Redis que arranque usando tu archivo
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # STORAGE (MinIO)
  # ---------------------------------------
  # * minio/minio y minio/mc ya no existen en Docker Hub (pull access denied). El servidor usa la
  # * imagen de Chainguard: corre sin root y no puede escribir en el volumen, por eso `user: '0'`;
  # * no trae curl, así que el healthcheck habla HTTP con /dev/tcp de bash (tampoco hay grep).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: '0'
    container_name: app-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r l <&3 && [[ $$l == *' 200'* ]]"
      interval: 30s
      timeout: 20s
      retries: 3

  # Contenedor temporal para crear el bucket automáticamente
  # * Imagen congelada (bitnamilegacy): la de Chainguard no trae sh y create-buckets.sh lo necesita.
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: app-minio-init
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: >
      /bin/sh -c "sh /create-buckets.sh"
    networks:
      - app-network

  # ---------------------------------------
  # METRICS & OBSERVABILITY
  # ---------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: app-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: app-grafana
    depends_on:
      - prometheus
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - '3000:3000'
    networks:
      - app-network

# ---------------------------------------
# REDES Y VOLÚMENES
# ---------------------------------------
networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres_data:
    name: app-postgres_data
  redis_data:
    name: app-redis_data
  minio_data:
    name: app-minio_data
  frontend_node_modules_root:
    name: app-frontend-node_modules-root
  frontend_node_modules_pkg:
    name: app-frontend-node_modules-pkg
