name: drivehub

# * Perfiles: la infraestructura (bases, broker, storage) no tiene perfil y
# * siempre arranca. El resto se activa con COMPOSE_PROFILES en el .env
# * (por defecto `backend,frontend`, o sea todo). Para levantar
# * solo la infra y correr un servicio desde el IDE, dejar COMPOSE_PROFILES vacío.
# * Perfil `extras` (no activo por defecto): pagos, academico, contenido, notificaciones,
# * asistente-ia y sus bases (mongo, dynamodb, minio). Se suman con
# * COMPOSE_PROFILES=backend,frontend,extras cuando hagan falta (consume bastante RAM).
# * Puertos fijos por servicio (iguales dentro y fuera de Docker), ver
# * docs/INFRAESTRUCTURA.md#puertos.

x-spring-dev: &spring-dev
  image: maven:3.9-eclipse-temurin-21-alpine
  profiles: ['backend']
  # * RAM acotada: Maven + la app corren como dos JVM dentro del contenedor.
  mem_limit: 700m
  command: mvn spring-boot:run -Dspring-boot.run.profiles=dev
  networks:
    - drivehub-network

services:
  # ---------------------------------------
  # REVERSE PROXY (punto de entrada web)
  # ---------------------------------------
  proxy:
    image: nginx:alpine
    container_name: drivehub-proxy
    mem_limit: 64m
    profiles: ['frontend']
    # Si Docker Desktop lo mata a mitad de un restart, que reintente solo.
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - drivehub-network

  # =======================================
  # BACKEND (microservicios)
  # =======================================

  # API Gateway (Spring Cloud Gateway): único punto de entrada a /api/v1/**
  gateway:
    <<: *spring-dev
    container_name: drivehub-gateway
    working_dir: /app/projects/backend/gateway
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xmx224m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m
      - IDENTIDAD_URL=http://drivehub-identidad:8081
      - ESCUELA_URL=http://drivehub-escuela:8082
      - PAGOS_URL=http://drivehub-pagos:8083
      - ACADEMICO_URL=http://drivehub-academico:8084
      - CONTENIDO_URL=http://drivehub-contenido:8085
      - NOTIFICACIONES_URL=http://drivehub-notificaciones:8086
      - ASISTENTE_IA_URL=http://drivehub-asistente-ia:8087

  # Identidad (Spring Boot, hexagonal) -- PostgreSQL `identidad`
  identidad:
    <<: *spring-dev
    container_name: drivehub-identidad
    working_dir: /app/projects/backend/identidad
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Para que Testcontainers (TESTING_BACKEND.md) pueda levantar contenedores
      # desde DENTRO de este contenedor al correr `mvn test`.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '8081:8081'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xmx224m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m
      # Testcontainers sobre el socket montado (ver nota de Docker Desktop en TESTING_BACKEND.md).
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://drivehub-postgres:5432/identidad
      - SPRING_DATASOURCE_USERNAME=identidad
      - SPRING_DATASOURCE_PASSWORD=${IDENTIDAD_DB_PASSWORD}
      - SPRING_RABBITMQ_HOST=drivehub-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MINIO_URL=http://drivehub-minio:9000
      # Host con el que se firman las URLs de lectura de las fotos (CU06): el que alcanza el navegador o el teléfono.
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      # URL interna de Escuela: el registro (CU01) resuelve el slug de la escuela sin pasar por el gateway.
      - ESCUELA_URL=http://drivehub-escuela:8082
      # Dirección a partir de la ubicación del mapa (CU08a): Nominatim de OpenStreetMap. El servidor público
      # pide un User-Agent identificable y 1 consulta por segundo; en producción, una instancia propia.
      - GEOCODIFICACION_URL=${GEOCODIFICACION_URL:-https://nominatim.openstreetmap.org}
      - GEOCODIFICACION_USER_AGENT=${GEOCODIFICACION_USER_AGENT:-DriveHub/1.0}
      # Correo (CU04b, CU04): en desarrollo va a Mailpit; con un SMTP real solo cambian estos valores.
      - SMTP_HOST=${SMTP_HOST:-drivehub-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@drivehub.local}
      # Web a la que apuntan los enlaces de los correos.
      - APP_WEB_URL=${APP_WEB_URL:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Escuela (Spring Boot, clean) -- PostgreSQL `escuela`
  escuela:
    <<: *spring-dev
    container_name: drivehub-escuela
    working_dir: /app/projects/backend/escuela
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Para que Testcontainers (TESTING_BACKEND.md) pueda levantar contenedores
      # desde DENTRO de este contenedor al correr `mvn test`.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '8082:8082'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xmx224m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m
      # Testcontainers sobre el socket montado (ver nota de Docker Desktop en TESTING_BACKEND.md).
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://drivehub-postgres:5432/escuela
      # Claves públicas de Identidad (JWKS) para validar el JWT (CU02).
      - IDENTIDAD_URL=http://drivehub-identidad:8081
      - SPRING_DATASOURCE_USERNAME=escuela
      # Fotos de los autos (CU07): se piden al .env, vacías si no hay cuenta de Cloudinary.
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - SPRING_DATASOURCE_PASSWORD=${ESCUELA_DB_PASSWORD}
      - SPRING_RABBITMQ_HOST=drivehub-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Pagos (Spring Boot, capas) -- PostgreSQL `pagos`
  pagos:
    <<: *spring-dev
    container_name: drivehub-pagos
    profiles: ['extras']
    working_dir: /app/projects/backend/pagos
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Para que Testcontainers (TESTING_BACKEND.md) pueda levantar contenedores
      # desde DENTRO de este contenedor al correr `mvn test`.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '8083:8083'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xmx224m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m
      # Testcontainers sobre el socket montado (ver nota de Docker Desktop en TESTING_BACKEND.md).
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://drivehub-postgres:5432/pagos
      # Claves públicas de Identidad (JWKS) para validar el JWT (CU02).
      - IDENTIDAD_URL=http://drivehub-identidad:8081
      # Alumnos asignados a un instructor (CU29).
      - ESCUELA_URL=http://drivehub-escuela:8082
      # PDF de los comprobantes (CU30): bucket privado de MinIO. En desarrollo, con la cuenta de MinIO.
      - MINIO_ENDPOINT=http://drivehub-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_COMPROBANTES=drivehub-pagos
      - SPRING_DATASOURCE_USERNAME=pagos
      - SPRING_DATASOURCE_PASSWORD=${PAGOS_DB_PASSWORD}
      # Pasarela de pago, Stripe (CU26). Vacias, el servicio arranca igual y responde 503 al cobrar.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PAGOS_URL_RETORNO=${PAGOS_URL_RETORNO:?Define PAGOS_URL_RETORNO en .env (ver .env.example)}
      - PAGOS_ENLACE_APP=${PAGOS_ENLACE_APP:?Define PAGOS_ENLACE_APP en .env (ver .env.example)}
      # * Credencial de servicio de las rutas internas (CU44): la misma que recibe academico
      - PAGOS_CREDENCIAL_ACADEMICO=${PAGOS_CREDENCIAL_ACADEMICO:?Define PAGOS_CREDENCIAL_ACADEMICO en .env (ver .env.example)}
      # Bolivianos por dolar: solo de esta variable, sin valor por defecto en el codigo.
      - TIPO_CAMBIO_BS_USD=${TIPO_CAMBIO_BS_USD:?Define TIPO_CAMBIO_BS_USD en .env (ver .env.example)}
      - SPRING_RABBITMQ_HOST=drivehub-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MINIO_URL=http://drivehub-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # CLI de Stripe (opcional): reenvia los avisos de cobro de Stripe al gateway, para no instalarla en cada maquina.
  # Se activa con COMPOSE_PROFILES=...,stripe y STRIPE_SECRET_KEY en el .env. Su log imprime el `whsec_...`.
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: drivehub-stripe-cli
    profiles: ['stripe']
    command: >-
      listen --api-key ${STRIPE_SECRET_KEY:?Define STRIPE_SECRET_KEY en el .env para usar el perfil stripe}
      --events checkout.session.completed,checkout.session.expired,refund.updated,refund.failed,charge.refunded
      --forward-to http://gateway:8080/api/v1/webhooks-stripe
    # * En la misma red que el gateway: sin esto cae en la red por defecto y no resuelve el nombre `gateway`
    networks:
      - drivehub-network
    restart: unless-stopped

  # Académico (Spring Boot, capas) -- MongoDB `academico`
  academico:
    <<: *spring-dev
    container_name: drivehub-academico
    profiles: ['extras']
    working_dir: /app/projects/backend/academico
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Para que Testcontainers (TESTING_BACKEND.md) pueda levantar contenedores
      # desde DENTRO de este contenedor al correr `mvn test`.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '8084:8084'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xmx224m -Xms32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_MONGODB_URI=mongodb://drivehub-mongo:27017/academico?replicaSet=rs0
      # Claves públicas de Identidad (JWKS) para validar el JWT (CU02) y nombres de los instructores (CU14).
      - IDENTIDAD_URL=http://drivehub-identidad:8081
      # Billetera de horas: saldo, descontar y devolver al reservar una clase (CU14).
      - PAGOS_URL=http://drivehub-pagos:8083
      # * Credencial con la que el orquestador se identifica ante las rutas internas de Pagos (CU44): la misma de pagos
      - PAGOS_CREDENCIAL_ACADEMICO=${PAGOS_CREDENCIAL_ACADEMICO:?Define PAGOS_CREDENCIAL_ACADEMICO en .env (ver .env.example)}
      - SPRING_RABBITMQ_HOST=drivehub-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Contenido (Laravel, capas) -- MongoDB `contenido`
  contenido:
    build:
      context: ./projects/backend/contenido
      target: dev
    container_name: drivehub-contenido
    # * En reposo usa ~40m (php artisan serve de desarrollo): 160m deja margen para composer y los picos.
    # * Libera memoria para el contenedor `frontend`, que es el que más pide.
    mem_limit: 160m
    profiles: ['extras']
    working_dir: /app
    volumes:
      - ./projects/backend/contenido:/app
      # vendor/ aislado del bind mount, mismo motivo que node_modules abajo.
      - contenido_vendor:/app/vendor
    ports:
      - '8085:8085'
    environment:
      - APP_ENV=local
      - APP_KEY=${CONTENIDO_APP_KEY}
      - MONGODB_URI=mongodb://drivehub-mongo:27017/contenido?replicaSet=rs0
      - MONGODB_DATABASE=contenido
      - RABBITMQ_HOST=drivehub-rabbitmq
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MINIO_URL=http://drivehub-minio:9000
      # URL con la que el NAVEGADOR abre los archivos (el bucket es de lectura pública).
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # Claves públicas de Identidad (JWKS) para validar el JWT (CU02).
      - IDENTIDAD_URL=http://drivehub-identidad:8081
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - drivehub-network

  # Notificaciones (NestJS, capas) -- DynamoDB
  notificaciones:
    image: node:24-alpine
    container_name: drivehub-notificaciones
    # * Usa ~290m reales (NestJS en modo watch con la compilación de TypeScript): con 320m el kernel ya lo
    # * presionaba al límite; 384m deja ~90m de margen para `pnpm install` y los picos.
    mem_limit: 384m
    profiles: ['extras']
    working_dir: /app/projects/backend/notificaciones
    volumes:
      - .:/app
      # node_modules aislados del bind mount: si no, pnpm dentro del
      # contenedor escribe symlinks de Linux en el filesystem de Windows que
      # rompen el pnpm del host (y viceversa). Volúmenes propios de este
      # contenedor, separados de los del frontend, para que dos `pnpm install`
      # en paralelo no pisen el mismo node_modules raíz.
      - notificaciones_node_modules_root:/app/node_modules
      - notificaciones_node_modules_pkg:/app/projects/backend/notificaciones/node_modules
    command: sh -c "corepack enable pnpm && pnpm install --filter ./projects/backend/notificaciones && pnpm run start:dev"
    ports:
      - '8086:8086'
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=8086
      - DYNAMODB_ENDPOINT=http://drivehub-dynamodb:8000
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@drivehub-rabbitmq:5672
    depends_on:
      dynamodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - drivehub-network

  # Asistente IA (FastAPI, capas) -- DynamoDB
  asistente-ia:
    build:
      context: ./projects/backend/asistente-ia
      target: dev
    container_name: drivehub-asistente-ia
    mem_limit: 256m
    profiles: ['extras']
    working_dir: /app
    volumes:
      - ./projects/backend/asistente-ia:/app
    ports:
      - '8087:8087'
    environment:
      - DYNAMODB_ENDPOINT=http://drivehub-dynamodb:8000
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@drivehub-rabbitmq:5672
      - MINIO_URL=http://drivehub-minio:9000
    depends_on:
      dynamodb:
        condition: service_started
    networks:
      - drivehub-network

  # =======================================
  # FRONTEND (micro-frontends, modo desarrollo)
  # =======================================
  # * Un solo contenedor corre los 7 dev servers en paralelo (shell + 6 remotos),
  # * cada uno en su puerto. El navegador carga el shell por nginx (puerto 80)
  # * y el shell trae cada remoto desde su propio puerto según
  # * projects/frontend/shell/public/federation.manifest.json.
  frontend:
    image: node:24-alpine
    container_name: drivehub-frontend
    # * Corren shell, identidad, escuela, pagos (CU25), contenido y examenes. Para sumar un remoto: agregar
    # * `--filter <app>` a los dos comandos de abajo (y su puerto ya esta publicado).
    # * Seis dev servers de Angular/Vite en un solo contenedor: con 2432m el kernel lo mataba por memoria (OOM) al
    # * sumar `pagos`. Cada remoto nuevo suma unos 300-400m: si vuelve a pasar, subir este valor.
    mem_limit: 3072m
    profiles: ['frontend']
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules_root:/app/node_modules
      - frontend_nm_shell:/app/projects/frontend/shell/node_modules
      - frontend_nm_identidad:/app/projects/frontend/identidad/node_modules
      - frontend_nm_escuela:/app/projects/frontend/escuela/node_modules
      - frontend_nm_pagos:/app/projects/frontend/pagos/node_modules
      - frontend_nm_examenes:/app/projects/frontend/examenes/node_modules
      - frontend_nm_contenido:/app/projects/frontend/contenido/node_modules
      - frontend_nm_asistente_ia:/app/projects/frontend/asistente-ia/node_modules
      # * El paquete compartido @drivehub/gestion (lit): su node_modules también va aislado, por lo mismo.
      - frontend_nm_gestion:/app/packages/gestion/node_modules
      # * Idem @drivehub/ui (armazón, menú, cabecera): también lit, también aislado.
      - frontend_nm_ui:/app/packages/ui/node_modules
    command: >
      sh -c "corepack enable pnpm &&
      pnpm install --filter shell --filter identidad --filter escuela --filter pagos --filter contenido --filter examenes --filter @drivehub/gestion --filter @drivehub/ui &&
      pnpm --filter shell --filter identidad --filter escuela --filter pagos --filter contenido --filter examenes --parallel run dev"
    ports:
      - '4200:4200'
      - '4201:4201'
      - '4202:4202'
      - '4203:4203'
      - '4204:4204'
      - '4205:4205'
      - '4206:4206'
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=384
      - CHOKIDAR_USEPOLLING=true
      # Destino del proxy /api del dev server del shell (proxy.conf.mjs).
      - API_GATEWAY_URL=http://drivehub-gateway:8080
    networks:
      - drivehub-network

  # =======================================
  # INFRAESTRUCTURA (siempre arranca)
  # =======================================

  # PostgreSQL 18: una base y un usuario por servicio (identidad, escuela,
  # pagos), creados por infrastructure/postgres/init/01-crear-bases.sh.
  postgres:
    image: postgres:18-alpine
    container_name: drivehub-postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
      ESCUELA_DB_PASSWORD: ${ESCUELA_DB_PASSWORD}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # * Puerto del HOST configurable: si la máquina ya tiene un Postgres en
      # * 5432, se cambia POSTGRES_HOST_PORT en el .env. Dentro de la red de
      # * Docker siempre es 5432.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    networks:
      - drivehub-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB 8 como replica set de un nodo: las transacciones multi-documento
  # (reserva + franja + outbox en Académico) solo funcionan sobre un replica set.
  # * El healthcheck inicializa el replica set la primera vez (rs.initiate) y
  # * después solo verifica que esté arriba. Sin auth: solo desarrollo local.
  # * Desde el host, conectar con ?directConnection=true (el miembro del
  # * replica set se anuncia como drivehub-mongo, que el host no resuelve).
  mongo:
    image: mongo:8
    container_name: drivehub-mongo
    profiles: ['extras']
    mem_limit: 512m
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - drivehub-network
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'drivehub-mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  # DynamoDB local (Notificaciones, Asistente IA). `-sharedDb` hace que todos
  # los clientes vean las mismas tablas sin importar región/credenciales.
  # * Cada servicio crea sus propias tablas al arrancar (no hay script central),
  # * igual que Flyway en los servicios PostgreSQL. Ver docs/INFRAESTRUCTURA.md.
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: drivehub-dynamodb
    profiles: ['extras']
    mem_limit: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx192m -XX:+UseSerialGC
    # * Corre como root para poder escribir en el volumen montado (la imagen
    # * usa un usuario sin permisos sobre /home/dynamodblocal/data).
    user: root
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/home/dynamodblocal/data']
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    ports:
      - '8000:8000'
    networks:
      - drivehub-network

  # RabbitMQ: bus de eventos entre servicios (outbox de Pagos y Académico,
  # consumidores en Notificaciones, etc.). Consola en http://localhost:15672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: drivehub-rabbitmq
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - drivehub-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------
  # STORAGE (MinIO): PDF, videos, fotos. Un bucket por servicio dueño,
  # ver infrastructure/minio/create-buckets.sh.
  # ---------------------------------------
  # * minio/minio y minio/mc ya no existen en Docker Hub (pull access denied). El servidor usa la
  # * imagen de Chainguard: corre sin root y no puede escribir en el volumen, por eso `user: '0'`;
  # * no trae curl, así que el healthcheck habla HTTP con /dev/tcp de bash (tampoco hay grep).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: '0'
    container_name: drivehub-minio
    profiles: ['extras']
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - drivehub-network
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r l <&3 && [[ $$l == *' 200'* ]]"
      interval: 30s
      timeout: 20s
      retries: 3

  # Contenedor temporal que crea los buckets y termina.
  # * Imagen congelada (bitnamilegacy): la de Chainguard no trae sh y create-buckets.sh lo necesita.
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: drivehub-minio-init
    profiles: ['extras']
    mem_limit: 64m
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: >
      /bin/sh -c "sh /create-buckets.sh"
    networks:
      - drivehub-network

  # Servidor SMTP de desarrollo (Identidad: recuperar contraseña y confirmar correo).
  # * No entrega nada de verdad: guarda los correos y los muestra en su bandeja web (:8025).
  # * Para enviar correos reales basta con apuntar las variables SMTP_* de Identidad a otro servidor.
  mailpit:
    image: axllent/mailpit:latest
    container_name: drivehub-mailpit
    mem_limit: 64m
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - drivehub-network
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 30s
      timeout: 10s
      retries: 3

# ---------------------------------------
# REDES Y VOLÚMENES
# ---------------------------------------
networks:
  drivehub-network:
    name: drivehub-network
    driver: bridge

volumes:
  postgres_data:
    name: drivehub-postgres_data
  mongo_data:
