name: CI

# Corre en cada PR contra main y en cada push directo a main (ej. un merge).
# No hay job de deploy acá -- ver .claude/rules/CI_CD.md para por qué CD
# todavía no está definido para este proyecto.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Detecta qué microservicios / micro-frontends cambiaron para correr solo
  # sus jobs -- ver .claude/rules/CI_CD.md#un-job-por-proyecto-no-uno-solo-para-todo.
  # Cada filtro con nombre de servicio alimenta la matriz del job de su stack.
  changes:
    runs-on: ubuntu-latest
    outputs:
      spring: ${{ steps.spring.outputs.changes }}
      frontend: ${{ steps.frontend.outputs.changes }}
      notificaciones: ${{ steps.otros.outputs.notificaciones }}
      gestion: ${{ steps.otros.outputs.gestion }}
      asistente-ia: ${{ steps.otros.outputs.asistente-ia }}
      contenido: ${{ steps.otros.outputs.contenido }}
      mobile: ${{ steps.otros.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: spring
        with:
          filters: |
            gateway: 'projects/backend/gateway/**'
            identidad: 'projects/backend/identidad/**'
            escuela: 'projects/backend/escuela/**'
            pagos: 'projects/backend/pagos/**'
            academico: 'projects/backend/academico/**'
      - uses: dorny/paths-filter@v3
        id: frontend
        with:
          # Un cambio en un paquete compartido o en el lockfile re-valida todas las apps.
          filters: |
            shell: ['projects/frontend/shell/**', 'packages/**', 'pnpm-lock.yaml']
            identidad: ['projects/frontend/identidad/**', 'packages/**', 'pnpm-lock.yaml']
            escuela: ['projects/frontend/escuela/**', 'packages/**', 'pnpm-lock.yaml']
            pagos: ['projects/frontend/pagos/**', 'packages/**', 'pnpm-lock.yaml']
            examenes: ['projects/frontend/examenes/**', 'packages/**', 'pnpm-lock.yaml']
            contenido: ['projects/frontend/contenido/**', 'packages/**', 'pnpm-lock.yaml']
            asistente-ia: ['projects/frontend/asistente-ia/**', 'packages/**', 'pnpm-lock.yaml']
      - uses: dorny/paths-filter@v3
        id: otros
        with:
          filters: |
            notificaciones: ['projects/backend/notificaciones/**', 'pnpm-lock.yaml']
            gestion: ['packages/gestion/**', 'packages/mf-contract/**', 'pnpm-lock.yaml']
            asistente-ia: 'projects/backend/asistente-ia/**'
            contenido: 'projects/backend/contenido/**'
            mobile: 'projects/mobile/**'

  # ---------------------------------------------------------------
  # Microservicios Spring Boot (gateway, identidad, escuela, pagos, academico)
  # ---------------------------------------------------------------
  spring:
    needs: changes
    if: needs.changes.outputs.spring != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.changes.outputs.spring) }}
    defaults:
      run:
        working-directory: projects/backend/${{ matrix.servicio }}
    # * Bases reales para los tests que arrancan el contexto completo de Spring
    # * (XxxApplicationTests: Flyway necesita Postgres, Académico necesita Mongo).
    # * Mismas versiones que docker-compose.yml. Credenciales descartables de CI.
    # * Cada job de la matriz tiene sus propios contenedores: no se comparten bases.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: drivehub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drivehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El runner de Ubuntu trae Docker nativo: los tests con Testcontainers
      # corren de verdad acá en vez de quedar SKIPPED como en Windows.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x ./mvnw
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check
      - name: Tests
        run: ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/drivehub
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_MONGODB_URI: mongodb://localhost:27017/academico
      - name: Build
        run: ./mvnw -B clean package -DskipTests

  # ---------------------------------------------------------------
  # Notificaciones (NestJS)
  # ---------------------------------------------------------------
  notificaciones:
    needs: changes
    if: needs.changes.outputs.notificaciones == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./projects/backend/notificaciones
      - run: pnpm --dir projects/backend/notificaciones run lint
      - run: pnpm --dir projects/backend/notificaciones run test
      - run: pnpm --dir projects/backend/notificaciones run build

  # ---------------------------------------------------------------
  # Asistente IA (FastAPI)
  # ---------------------------------------------------------------
  asistente-ia:
    needs: changes
    if: needs.changes.outputs.asistente-ia == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/asistente-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/backend/asistente-ia/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  # ---------------------------------------------------------------
  # Contenido (Laravel)
  # ---------------------------------------------------------------
  contenido:
    needs: changes
    if: needs.changes.outputs.contenido == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/contenido
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  # ---------------------------------------------------------------
  # Micro-frontends (shell + remotos Angular y React)
  # ---------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # El lockfile vive en la raíz del workspace pnpm, no dentro de cada app.
      # `{ruta}...` instala también los paquetes del workspace de los que depende la app
      # (design-tokens, mf-contract, gestion) con sus propias dependencias (ej. lit). Sin las
      # llaves, pnpm no interpreta el `...` sobre una ruta.
      - run: pnpm install --frozen-lockfile --filter "{./projects/frontend/${{ matrix.app }}}..."
      - run: pnpm --dir projects/frontend/${{ matrix.app }} run lint
      - run: pnpm --dir projects/frontend/${{ matrix.app }} run test
      - run: pnpm --dir projects/frontend/${{ matrix.app }} run build

  # ---------------------------------------------------------------
  # Paquete @drivehub/gestion (<dh-gestion>): sus propios tests, aparte de las apps
  # ---------------------------------------------------------------
  gestion:
    needs: changes
    if: needs.changes.outputs.gestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./packages/gestion
      - run: pnpm --dir packages/gestion run test

  # ---------------------------------------------------------------
  # Mobile (Flutter)
  # ---------------------------------------------------------------
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # pubspec.yaml declara `.env` como asset (ver CONSUMO_API_MOBILE.md) --
      # el archivo real no se commitea (.gitignore), así que sin este paso
      # `flutter analyze` falla con "asset_does_not_exist" en un checkout
      # limpio como el de CI. Se arma a partir de `.env.example`.
      - run: cp .env.example .env
      - run: flutter analyze
      - run: flutter test
