# Enlace de Tailscale hacia escuela cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: escuela
  annotations:
    tailscale.com/tailnet-fqdn: dh-escuela.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: http, port: 8082, protocol: TCP }
