# Enlace de Tailscale hacia academico cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: academico
  annotations:
    tailscale.com/tailnet-fqdn: dh-academico.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: http, port: 8084, protocol: TCP }
