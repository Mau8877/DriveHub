# Enlace de Tailscale hacia notificaciones cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: notificaciones
  annotations:
    tailscale.com/tailnet-fqdn: dh-notificaciones.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: http, port: 8086, protocol: TCP }
