# Enlace de Tailscale hacia identidad cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: identidad
  annotations:
    tailscale.com/tailnet-fqdn: dh-identidad.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: http, port: 8081, protocol: TCP }
