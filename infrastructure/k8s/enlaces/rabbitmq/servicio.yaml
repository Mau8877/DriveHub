# Enlace de Tailscale hacia rabbitmq cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  annotations:
    tailscale.com/tailnet-fqdn: dh-rabbitmq.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: amqp, port: 5672, protocol: TCP }
