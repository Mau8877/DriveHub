# Enlace de Tailscale hacia pagos cuando corre en otra nube. Ver README.md de esta carpeta.
apiVersion: v1
kind: Service
metadata:
  name: pagos
  annotations:
    tailscale.com/tailnet-fqdn: dh-pagos.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: http, port: 8083, protocol: TCP }
