# Pagos (Spring Boot, capas): compra de horas con Stripe, billetera y comprobantes. Base `pagos` en el Postgres de
# su clúster; los PDF de los comprobantes en el MinIO de su clúster.
apiVersion: v1
kind: Service
metadata:
  name: pagos
spec:
  selector:
    app: pagos
  ports:
    - name: http
      port: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      containers:
        - name: pagos
          image: drivehub-pagos
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: drivehub-entorno
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Djava.awt.headless=true
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/pagos
            - name: SPRING_DATASOURCE_USERNAME
              value: pagos
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: PAGOS_DB_PASSWORD }
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: RABBITMQ_USER }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: RABBITMQ_PASSWORD }
            - name: IDENTIDAD_URL
              value: http://identidad:8081
            - name: ESCUELA_URL
              value: http://escuela:8082
            - name: NOTIFICACIONES_URL
              value: http://notificaciones:8086
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_PASSWORD }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_USER }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_PASSWORD }
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: STRIPE_SECRET_KEY, optional: true }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: STRIPE_WEBHOOK_SECRET, optional: true }
            - name: PAGOS_CREDENCIAL_ACADEMICO
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: PAGOS_CREDENCIAL_ACADEMICO }
            - name: NOTIFICACIONES_CREDENCIAL_SERVICIOS
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: NOTIFICACIONES_CREDENCIAL_SERVICIOS, optional: true }
          startupProbe:
            httpGet: { path: /health/liveness, port: 8083 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/liveness, port: 8083 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/readiness, port: 8083 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { memory: 640Mi }
