# Asistente IA (FastAPI): sesiones, ayudas del tablero, agentes y servidor MCP. DynamoDB y MinIO.
apiVersion: v1
kind: Service
metadata:
  name: asistente-ia
spec:
  selector:
    app: asistente-ia
  ports:
    - name: http
      port: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asistente-ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asistente-ia
  template:
    metadata:
      labels:
        app: asistente-ia
    spec:
      containers:
        - name: asistente-ia
          image: drivehub-asistente-ia
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: drivehub-entorno
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: AWS_ACCESS_KEY_ID, optional: true }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: AWS_SECRET_ACCESS_KEY, optional: true }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: RABBITMQ_PASSWORD }
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - name: MINIO_URL
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_USER }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: drivehub-secretos, key: MINIO_ROOT_PASSWORD }
            - name: IDENTIDAD_URL
              value: http://identidad:8081
            - name: CONTENIDO_URL
              value: http://contenido:8085
            - name: ACADEMICO_URL
              value: http://academico:8084
            - name: PAGOS_URL
              value: http://pagos:8083
          startupProbe:
            tcpSocket: { port: 8087 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket: { port: 8087 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8087 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
