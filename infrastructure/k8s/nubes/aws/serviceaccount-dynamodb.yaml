# Cuenta de servicio de Notificaciones y Asistente IA. Con EKS Pod Identity recibe credenciales temporales de un rol
# de IAM con permiso solo sobre las tablas de DynamoDB del proyecto. El rol y su asociación se crean con:
#   eksctl create podidentityassociation --cluster drivehub --region us-east-1 \
#     --namespace drivehub --service-account-name drivehub-dynamodb --role-name drivehub-dynamodb \
#     --permission-policy-arns arn:aws:iam::<cuenta>:policy/drivehub-dynamodb
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drivehub-dynamodb
