# Correo de prueba: atrapa los correos (verificación, recuperar contraseña) y los muestra en http://correo.<IP>.sslip.io.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
    - name: web
      port: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
