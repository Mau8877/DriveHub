# El MinIO de AWS, alcanzado por Tailscale. Se llama minio-aws (no minio) porque en GCP ya existe el MinIO propio;
# la entrada pública archivos-aws.<IP>.sslip.io lo usa para servir las URLs prefirmadas que firman contenido y
# asistente-ia en AWS.
apiVersion: v1
kind: Service
metadata:
  name: minio-aws
  annotations:
    tailscale.com/tailnet-fqdn: dh-minio-aws.tail9b7a35.ts.net
spec:
  type: ExternalName
  externalName: lo-reemplaza-tailscale
  ports:
    - { name: api, port: 9000, protocol: TCP }
