# Entrada pública por Traefik (IP del balanceador de GKE), con HTTPS de Let's Encrypt (cert-manager, emisor
# letsencrypt de emisor-letsencrypt.yaml). IP_PUBLICA: la IP con guiones (34-1-2-3).
#   https://drivehub.34-11-98-15.sslip.io            -> web,  /api -> gateway
#   https://correo.34-11-98-15.sslip.io              -> Mailpit (correos de la demo)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drivehub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - secretName: drivehub-tls
      hosts:
        - drivehub.34-11-98-15.sslip.io
        - correo.34-11-98-15.sslip.io
  rules:
    - host: drivehub.34-11-98-15.sslip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
    - host: correo.34-11-98-15.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mailpit, port: { number: 8025 } }
