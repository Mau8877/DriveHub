# Emisor de certificados de Let's Encrypt para cert-manager: valida cada host por HTTP-01 a través de Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cuenta
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
