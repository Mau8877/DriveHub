worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 127.0.0.11 es el DNS embebido de Docker dentro de la red del compose.
    # Con esto + `set $var ...` + `proxy_pass $var` (en vez de un bloque
    # `upstream {}` con el hostname fijo), nginx resuelve cada backend en
    # tiempo de REQUEST, no al arrancar. Antes, si `app-frontend`
    # o `app-backend` no estaban levantados en el instante exacto
    # en que nginx arrancaba, fallaba con "host not found in upstream" y
    # el proceso moría por completo (sin reintentar solo) -- justo lo que
    # pasó tras un reinicio de Docker Desktop en medio de esta sesión. Con
    # resolución dinámica, nginx arranca igual y devuelve 502 hasta que el
    # contenedor de destino esté disponible, sin necesitar reinicio manual.
    resolver 127.0.0.11 valid=10s;

    server {
        # Escuchamos en el puerto 80 estándar
        listen 80;
        server_name localhost;

        # 1. Regla para el Backend: Todo lo que empiece con /api/ va a Spring Boot
        location /api/ {
            set $backend_upstream http://app-backend:8080;
            proxy_pass $backend_upstream;

            # Pasamos las cabeceras originales para que Spring Boot sepa la IP real del cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Regla para el Frontend: Cualquier otra ruta va a React (Vite)
        location / {
            set $frontend_upstream http://app-frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;

            # 3. Soporte OBLIGATORIO para WebSockets (Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
