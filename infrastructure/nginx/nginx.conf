worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 127.0.0.11 es el DNS embebido de Docker dentro de la red del compose.
    # Con esto + `set $var ...` + `proxy_pass $var` (en vez de un bloque
    # `upstream {}` con el hostname fijo), nginx resuelve cada destino en
    # tiempo de REQUEST, no al arrancar: si el gateway o el shell todavía no
    # están levantados, nginx arranca igual y devuelve 502 hasta que estén,
    # en vez de morir con "host not found in upstream".
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # 1. API: todo /api/ va al API Gateway (Spring Cloud Gateway), que
        #    enruta a cada microservicio. nginx no conoce los microservicios.
        location /api/ {
            set $gateway_upstream http://drivehub-gateway:8080;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Web: cualquier otra ruta va al shell (Angular). Los remotos se
        #    cargan desde sus propios puertos según el manifiesto de
        #    federación del shell, no pasan por acá.
        location / {
            set $shell_upstream http://drivehub-frontend:4200;
            proxy_pass $shell_upstream;
            proxy_set_header Host $host;

            # WebSockets para el live reload del dev server de Angular.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
