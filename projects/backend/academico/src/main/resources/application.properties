spring.application.name=academico
server.port=${SERVER_PORT:8084}

# ==========================================
# 1. BASE DE DATOS (MongoDB, base propia 'academico')
# ==========================================
# * Replica set de un nodo (rs0): necesario para transacciones multi-documento
# * (reserva + franja + outbox). Desde el host: directConnection=true, porque el
# * miembro del replica set se anuncia con el hostname interno de Docker.
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/academico?directConnection=true}
# Crea al arrancar los índices declarados con @Indexed/@CompoundIndex en los Models.
spring.data.mongodb.auto-index-creation=true
# UUID como binario subtipo 4 (estándar), no el formato legado de Java.
spring.mongodb.representation.uuid=standard

# ==========================================
# 2. BUS DE EVENTOS (RabbitMQ)
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:drivehub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:drivehub_local_pass_123}

# ==========================================
# 3. ACTUATOR (health check + métricas Prometheus)
# ==========================================
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# SEGURIDAD: validacion del JWT (CU02)
# ==========================================
# Claves publicas de Identidad (JWKS). Se piden directo al servicio, por la red interna.
app.auth.jwks-uri=${IDENTIDAD_URL:http://localhost:8081}/.well-known/jwks.json

# ==========================================
# HORARIOS DEL INSTRUCTOR (CU12)
# ==========================================
# Zona horaria de la escuela: decide que es "hoy" y "ahora" al generar las franjas.
# Confirmar que America/La_Paz (UTC-4, sin horario de verano) es la correcta.
app.horarios.zona-horaria=${HORARIOS_ZONA_HORARIA:America/La_Paz}
# Dias hacia adelante (contando hoy) para los que se generan franjas. 28 = cada dia de la semana 4 veces.
app.horarios.horizonte-dias=28
# Cuando completa las franjas que faltan de todos los horarios activos (cron de Spring, en la zona de arriba).
app.horarios.extension-cron=0 0 2 * * *
# Se apaga en los tests de integracion, que la invocan a mano.
app.horarios.job-habilitado=true
