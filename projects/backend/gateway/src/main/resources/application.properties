spring.application.name=gateway
server.port=${SERVER_PORT:8080}

# ==========================================
# 1. RUTAS A LOS MICROSERVICIOS
# ==========================================
# * Se enruta por RECURSO (/api/v1/{recurso}), no por nombre de servicio: el
# * cliente no sabe qué microservicio atiende cada recurso, y un recurso puede
# * mudarse de servicio sin romper el contrato HTTP. Al crear un recurso nuevo
# * en un servicio, se agrega su path al predicado de ese servicio acá.
# * Cada URL se puede pisar por variable de entorno (docker-compose las define
# * con el hostname interno de cada contenedor).

# Identidad (Spring Boot, :8081)
spring.cloud.gateway.server.webmvc.routes[0].id=identidad
spring.cloud.gateway.server.webmvc.routes[0].uri=${IDENTIDAD_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/estudiantes/**,/api/v1/roles/**,/api/v1/permisos/**

# Escuela (Spring Boot, :8082)
spring.cloud.gateway.server.webmvc.routes[1].id=escuela
spring.cloud.gateway.server.webmvc.routes[1].uri=${ESCUELA_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/instructores/**,/api/v1/vehiculos/**,/api/v1/categorias-licencia/**,/api/v1/escuelas/**,/api/v1/asignaciones-vehiculo/**,/api/v1/asignaciones-alumno/**

# Pagos (Spring Boot, :8083)
spring.cloud.gateway.server.webmvc.routes[2].id=pagos
spring.cloud.gateway.server.webmvc.routes[2].uri=${PAGOS_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/planes-pago/**,/api/v1/pagos/**,/api/v1/comprobantes/**,/api/v1/billeteras-horas/**,/api/v1/webhooks-stripe/**

# Académico (Spring Boot, :8084)
spring.cloud.gateway.server.webmvc.routes[3].id=academico
spring.cloud.gateway.server.webmvc.routes[3].uri=${ACADEMICO_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/plantillas-horario/**,/api/v1/franjas/**,/api/v1/solicitudes-clase/**,/api/v1/reservas/**,/api/v1/clases/**,/api/v1/pruebas-clase/**,/api/v1/examenes-conduccion/**,/api/v1/preguntas/**,/api/v1/simulacros/**,/api/v1/intentos-simulacro/**,/api/v1/resultados/**

# Contenido (Laravel, :8085)
spring.cloud.gateway.server.webmvc.routes[4].id=contenido
spring.cloud.gateway.server.webmvc.routes[4].uri=${CONTENIDO_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/manuales/**,/api/v1/tutoriales/**

# Notificaciones (NestJS, :8086)
spring.cloud.gateway.server.webmvc.routes[5].id=notificaciones
spring.cloud.gateway.server.webmvc.routes[5].uri=${NOTIFICACIONES_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/notificaciones/**,/api/v1/preferencias-notificacion/**,/api/v1/dispositivos-push/**

# Asistente IA (FastAPI, :8087)
spring.cloud.gateway.server.webmvc.routes[6].id=asistente-ia
spring.cloud.gateway.server.webmvc.routes[6].uri=${ASISTENTE_IA_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/sesiones-ia/**,/api/v1/ayudas-tablero/**,/api/v1/agentes-ia/**

# ==========================================
# 2. CORS (navegador <-> gateway)
# ==========================================
# Shell (4200) y remotos (4201-4206) en desarrollo, y nginx (80).
# * 4300: la app movil corrida en Chrome en desarrollo (flutter run -d chrome --web-port 4300).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:4206,http://localhost:4300}

# ==========================================
# 3. RATE LIMIT (anti-abuso, por IP, solo /api/v1/**)
# ==========================================
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:100}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:100}

# ==========================================
# 4. ACTUATOR (health check + métricas Prometheus)
# ==========================================
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# SEGURIDAD: validacion del JWT (CU02)
# ==========================================
# Claves publicas de Identidad (JWKS). Se piden directo al servicio, por la red interna.
app.auth.jwks-uri=${IDENTIDAD_URL:http://localhost:8081}/.well-known/jwks.json

