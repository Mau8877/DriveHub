spring.application.name=pagos
server.port=${SERVER_PORT:8083}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL, base propia 'pagos')
# ==========================================
# * Una base y un usuario por microservicio: este servicio nunca lee tablas
# * de otro (ver .claude/rules/MICROSERVICIOS.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pagos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pagos_local_pass_123}

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# 'validate' verifica que la BD coincida con los Models, pero NO la modifica: el esquema es de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# 3. FLYWAY (migraciones)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# 4. BUS DE EVENTOS (RabbitMQ)
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:drivehub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:drivehub_local_pass_123}

# ==========================================
# 5. ALMACENAMIENTO (MinIO, namespace propio 'app.minio')
# ==========================================
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=drivehub-pagos

# ==========================================
# 6. ACTUATOR (health check + métricas Prometheus)
# ==========================================
# base-path=/ sirve los endpoints en la raíz (/health en vez de /actuator/health)
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# PAGOS: tipo de cambio para mostrar el costo de un plan en dolares (CU25)
# ==========================================
# Bolivianos por dolar (cambio oficial). No hay servicio externo: para cambiarlo, esta variable de entorno.
# El servicio no arranca si no es mayor a 0.
app.pagos.tipo-cambio-bs-usd=${TIPO_CAMBIO_BS_USD:11.77}

# ==========================================
# SEGURIDAD: validacion del JWT (CU02)
# ==========================================
# Claves publicas de Identidad (JWKS). Se piden directo al servicio, por la red interna.
app.auth.jwks-uri=${IDENTIDAD_URL:http://localhost:8081}/.well-known/jwks.json
