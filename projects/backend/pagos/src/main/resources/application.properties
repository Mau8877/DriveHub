spring.application.name=pagos
server.port=${SERVER_PORT:8083}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL, base propia 'pagos')
# ==========================================
# * Una base y un usuario por microservicio: este servicio nunca lee tablas
# * de otro (ver .claude/rules/MICROSERVICIOS.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pagos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pagos_local_pass_123}

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# 'validate' verifica que la BD coincida con los Models, pero NO la modifica: el esquema es de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# 3. FLYWAY (migraciones)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# 4. BUS DE EVENTOS (RabbitMQ)
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:drivehub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:drivehub_local_pass_123}

# ==========================================
# 5. ALMACENAMIENTO (MinIO, namespace propio 'app.minio')
# ==========================================
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=drivehub-pagos

# ==========================================
# 6. ACTUATOR (health check + métricas Prometheus)
# ==========================================
# base-path=/ sirve los endpoints en la raíz (/health en vez de /actuator/health)
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# PAGOS: tipo de cambio para mostrar el costo de un plan en dolares (CU25)
# ==========================================
# Bolivianos por dolar. Sale SOLO de la variable de entorno TIPO_CAMBIO_BS_USD (ver .env.example): no hay valor
# por defecto aca ni en el codigo. No hay servicio externo: para cambiarlo, esa variable.
# El servicio no arranca sin la variable o si no es mayor a 0.
app.pagos.tipo-cambio-bs-usd=${TIPO_CAMBIO_BS_USD}

# ==========================================
# SEGURIDAD: validacion del JWT (CU02)
# ==========================================
# Claves publicas de Identidad (JWKS). Se piden directo al servicio, por la red interna.
app.auth.jwks-uri=${IDENTIDAD_URL:http://localhost:8081}/.well-known/jwks.json

# ==========================================
# PAGOS: la pasarela de pago, Stripe (CU26)
# ==========================================
# Las claves salen de variables de entorno y NUNCA se escriben en el repo. Vacias, el servicio arranca igual
# y falla recien al intentar cobrar (responde 503).
app.pagos.pasarela.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.pagos.pasarela.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Cuanto dura la pagina de pago, en minutos: Stripe exige entre 30 y 1440.
app.pagos.pasarela.vigencia-sesion-minutos=${PAGOS_VIGENCIA_SESION_MINUTOS:30}
# Pagina publica a la que vuelve el estudiante al terminar de pagar (la sirve este mismo servicio). Cambia con
# cada entorno, asi que sale SOLO de la variable de entorno PAGOS_URL_RETORNO (ver .env.example), sin valor por
# defecto. El servicio no arranca sin ella.
app.pagos.pasarela.url-retorno=${PAGOS_URL_RETORNO}
# Enlace con el que esa pagina abre la app movil (su esquema esta declarado en el manifiesto de la app).
app.pagos.pasarela.enlace-app=${PAGOS_ENLACE_APP}

# ==========================================
# PAGOS: llamadas a otros servicios, por la red interna (CU26)
# ==========================================
# Identidad: el perfil del estudiante al comprar (su nombre y el de su escuela quedan copiados en el pago).
app.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
app.identidad.timeout-segundos=5

# Escuela: los alumnos asignados a un instructor (CU29), con el token del instructor.
app.escuela.url=${ESCUELA_URL:http://localhost:8082}
app.escuela.timeout-segundos=5

# ==========================================
# PAGOS: vencimiento de los pagos pendientes (CU26)
# ==========================================
# Un pago pendiente cuya pagina de pago ya vencio pasa a FALLIDO. Corre cada tanto y espera un margen
# despues del vencimiento, para que un aviso tardio de la pasarela llegue primero.
app.pagos.vencimiento.cada-segundos=${PAGOS_VENCIMIENTO_CADA_SEGUNDOS:300}
app.pagos.vencimiento.margen-minutos=${PAGOS_VENCIMIENTO_MARGEN_MINUTOS:10}

# Porcentaje de lo pagado que se retiene al reembolsar una compra (de 0 a 50).
app.pagos.retencion-reembolso-porcentaje=${REEMBOLSO_RETENCION_PORCENTAJE:5}

# Cuanto puede diferir la hora de un aviso de la pasarela de la hora de este servicio para aceptarlo, en segundos.
app.pagos.pasarela.tolerancia-firma-segundos=${PAGOS_TOLERANCIA_FIRMA_SEGUNDOS:300}

# ==========================================
# ALMACEN de los PDF de los comprobantes (CU30): MinIO, bucket privado
# ==========================================
# Las credenciales salen SOLO de variables de entorno (pueden estar vacias: el servicio arranca igual y falla al
# guardar o leer un PDF). El bucket es el de Pagos (infrastructure/minio/create-buckets.sh).
app.pagos.almacen.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.pagos.almacen.access-key=${MINIO_ACCESS_KEY:}
app.pagos.almacen.secret-key=${MINIO_SECRET_KEY:}
app.pagos.almacen.bucket=${MINIO_BUCKET_COMPROBANTES:drivehub-pagos}
app.pagos.almacen.timeout-segundos=5

# Cada cuanto se reintentan los comprobantes que quedaron sin PDF (CU30), en segundos.
app.pagos.comprobantes-reintento-segundos=${COMPROBANTES_REINTENTO_SEGUNDOS:300}
# Cada cuánto se reintentan las compensaciones que la pasarela todavía no pudo devolver (CU31)
app.pagos.compensacion-reintento-segundos=${COMPENSACION_REINTENTO_SEGUNDOS:300}

# Rutas internas entre servicios (CU44): la credencial con la que Academico se identifica ante Pagos en /internal/**.
# Sin valor, Pagos rechaza TODAS las llamadas internas (falla cerrado). Nunca se escribe en el repositorio.
app.internal.credencial-academico=${PAGOS_CREDENCIAL_ACADEMICO:}
