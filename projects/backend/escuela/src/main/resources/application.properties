spring.application.name=escuela
server.port=${SERVER_PORT:8082}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL, base propia 'escuela')
# ==========================================
# * Una base y un usuario por microservicio: este servicio nunca lee tablas
# * de otro (ver .claude/rules/MICROSERVICIOS.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escuela}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escuela}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escuela_local_pass_123}

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# 'validate' verifica que la BD coincida con los Models, pero NO la modifica: el esquema es de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# 3. FLYWAY (migraciones)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Las migraciones llevan la fecha como versión (V2026...): dos ramas pueden traer una migración con fecha
# anterior a otra que una base ya aplicó. Con out-of-order Flyway aplica la que falta en lugar de no arrancar.
spring.flyway.out-of-order=true

# ==========================================
# 4. BUS DE EVENTOS (RabbitMQ)
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:drivehub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:drivehub_local_pass_123}

# ==========================================
# 6. ACTUATOR (health check + métricas Prometheus)
# ==========================================
# base-path=/ sirve los endpoints en la raíz (/health en vez de /actuator/health)
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# SEGURIDAD: validacion del JWT (CU02)
# ==========================================
# Claves publicas de Identidad (JWKS). Se piden directo al servicio, por la red interna.
app.auth.jwks-uri=${IDENTIDAD_URL:http://localhost:8081}/.well-known/jwks.json

# ==========================================
# IDENTIDAD (llamadas internas de Escuela, CU05)
# ==========================================
# Crear y revertir al Administrador de una escuela, por REST interno (sin pasar por el gateway).
# La misma variable que ya usa el JWKS de arriba.
app.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
app.identidad.timeout-segundos=${IDENTIDAD_TIMEOUT_SEGUNDOS:5}

# ==========================================
# CLOUDINARY (fotos de los autos, CU07)
# ==========================================
# El navegador sube directo a Cloudinary con una firma que genera este servicio; el API secret
# nunca sale de acá. Sin estas variables, pedir la firma responde 500 y el resto funciona igual.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
