spring.application.name=identidad
server.port=${SERVER_PORT:8081}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL, base propia 'identidad')
# ==========================================
# * Una base y un usuario por microservicio: este servicio nunca lee tablas
# * de otro (ver .claude/rules/MICROSERVICIOS.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identidad}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:identidad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:identidad_local_pass_123}

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# 'validate' verifica que la BD coincida con los Models, pero NO la modifica: el esquema es de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# 3. FLYWAY (migraciones)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Las migraciones llevan la fecha como versión (V2026...): dos ramas pueden traer una migración con fecha
# anterior a otra que una base ya aplicó. Con out-of-order Flyway aplica la que falta en lugar de no arrancar.
spring.flyway.out-of-order=true

# ==========================================
# 4. BUS DE EVENTOS (RabbitMQ)
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:drivehub}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:drivehub_local_pass_123}

# ==========================================
# 5. ALMACENAMIENTO (MinIO, namespace propio 'app.minio')
# ==========================================
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=drivehub-identidad

# ==========================================
# 6. ACTUATOR (health check + métricas Prometheus)
# ==========================================
# base-path=/ sirve los endpoints en la raíz (/health en vez de /actuator/health)
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# 7. REGISTRO DE ESTUDIANTES (CU01)
# ==========================================
# Edad minima (anios cumplidos) para crear una cuenta de estudiante.
app.registro.edad-minima=${REGISTRO_EDAD_MINIMA:18}

# Escuela: URL interna para resolver el slug de la escuela al registrar (CU01).
# Se llama directo al servicio, no por el gateway.
app.escuela.url=${ESCUELA_URL:http://localhost:8082}

# ==========================================
# 8. SESION (CU02)
# ==========================================
# Intentos fallidos consecutivos que bloquean la cuenta y minutos que dura el bloqueo.
app.auth.max-intentos=${AUTH_MAX_INTENTOS:5}
app.auth.bloqueo-minutos=${AUTH_BLOQUEO_MINUTOS:15}
# Vida del token de acceso (JWT) y de la sesion renovable.
app.auth.access-ttl-minutos=${AUTH_ACCESS_TTL_MINUTOS:15}
app.auth.refresh-ttl-dias=${AUTH_REFRESH_TTL_DIAS:7}

# ==========================================
# 9. CORREO Y ENLACES (CU04b, CU04)
# ==========================================
# SMTP: en desarrollo es Mailpit (docker-compose); en produccion, el del proveedor, solo cambiando estas variables.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
app.correo.remitente=${SMTP_FROM:no-reply@drivehub.local}
# Un SMTP caido no debe poner /health en DOWN.
management.health.mail.enabled=false
# Web a la que apuntan los enlaces de los correos (tambien para quien usa la app).
app.web.url=${APP_WEB_URL:http://localhost:4200}
# Vigencia del enlace de verificacion del correo.
app.auth.verificacion-ttl-horas=${AUTH_VERIFICACION_TTL_HORAS:24}
# Vigencia del enlace de recuperacion de contrasena.
app.auth.recuperacion-ttl-minutos=${AUTH_RECUPERACION_TTL_MINUTOS:30}

# ==========================================
# 10. PERFIL (CU06)
# ==========================================
# Host con el que se firman las URLs de lectura de las fotos: el que alcanza el navegador o el telefono (distinto de app.minio.url).
app.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
# Vigencia de la URL prefirmada de la foto; la sesion se renueva antes y devuelve una fresca.
app.perfil.foto.url-ttl-minutos=60
# Tamano maximo de la foto en bytes (5 MB) y lado maximo en pixeles.
app.perfil.foto.max-bytes=5242880
app.perfil.foto.max-lado-px=4000
# El multipart se corta aca, antes del controller (se traduce a ERR_IDE_17).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Vigencia del enlace de cambio de correo.
app.auth.cambio-correo-ttl-horas=${AUTH_CAMBIO_CORREO_TTL_HORAS:24}

# ==========================================
# 11. UBICACION Y DIRECCION (CU08a)
# ==========================================
# La direccion la calcula el servidor a partir de latitud y longitud (OpenStreetMap Nominatim).
# El servidor publico pide un User-Agent identificable y 1 consulta por segundo: sirve para
# desarrollo y poco volumen; en produccion, una instancia propia.
app.geocodificacion.url=${GEOCODIFICACION_URL:https://nominatim.openstreetmap.org}
app.geocodificacion.timeout-segundos=3
app.geocodificacion.user-agent=${GEOCODIFICACION_USER_AGENT:DriveHub/1.0}
