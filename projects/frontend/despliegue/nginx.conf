# Servidor de producción de la web: las 7 apps compiladas en un solo origen.
#   /                    -> shell (Angular, SPA: toda ruta desconocida devuelve index.html)
#   /remotos/{app}/      -> cada remoto (Angular o React), solo archivos estáticos
# La API (/api) no pasa por acá: la enruta el ingress directo al gateway.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Para las probes de Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Lo que no lleva hash en el nombre se vuelve a pedir siempre: si no, el navegador seguiría
    # cargando un remoto viejo después de un despliegue.
    location ~* (index\.html|remoteEntry\.(json|js)|\.manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Native Federation carga los módulos de los remotos Angular como .mjs.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # Un archivo de un remoto que no existe es un 404 real, nunca el index.html del shell.
    location /remotos/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
